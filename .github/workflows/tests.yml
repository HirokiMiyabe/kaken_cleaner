name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Python の版と xmltodict の版の組み合わせごとに、試験と v0.1.0 との比較を回す
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        xmltodict: ["0.13.0", "1.0.4"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # v0.1.0 のタグを比較に使う
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e ".[test]"
          python -m pip install "xmltodict==${{ matrix.xmltodict }}"
          python -m pip list
      - name: Tests
        run: python -m pytest -q
      - name: Existing columns match v0.1.0 (synthetic XML)
        run: |
          python tools/compare_versions.py v0.1.0:Kaken_Cleaner_fast.py Kaken_Cleaner_fast.py --synthetic 3000 | tee compare.log
          grep -q "mismatched cells: 0" compare.log
          grep -q "rows only in old: 0" compare.log

  xmltodict-output:
    # xmltodict の版を変えても、同じ XML から同じ出力になるかを確かめる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Convert the same synthetic XML with each xmltodict
        run: |
          python -m pip install -e .
          python -c "import importlib.util as u; s=u.spec_from_file_location('cv','tools/compare_versions.py'); m=u.module_from_spec(s); s.loader.exec_module(m); open('syn.xml','w',encoding='utf-8').write('<grantAwards>'+''.join(m.grant(i) for i in range(3000))+'</grantAwards>')"
          for v in 0.13.0 1.0.4; do
            python -m pip install -q "xmltodict==$v"
            python -c "from Kaken_Cleaner_fast import KakenToTable; KakenToTable('syn.xml').to_jsonlines('out_$v.jsonl', error_path='err_$v.tsv')"
          done
          cmp out_0.13.0.jsonl out_1.0.4.jsonl
